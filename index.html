  if ($("n-end")) $("n-end").onclick = () => { if (!UI.confirmEnd) { UI.confirmEnd = true; $("n-end").textContent = "Click again to end it for everyone"; return; } UI.confirmEnd = false; const pts = endRunLegacy(false); NET.ended(); UI.title(); showToastLegacy(pts); };
  document.querySelectorAll("[data-ncore]").forEach(b => b.onclick = () => { const k = b.dataset.ncore; if (host) { NET.players[0].core = k; NET.myCore = k; bcastLobby(); UI.title(); } else { NET.myCore = k; send(NET.conn, { k: "core", core: k }); if (S) { S.players[NET.me].core = k; UI.title(); } } });

// guests don't keep the War Table's "Menu" campaign controls; keep the lobby reachable
UI.howtoOnline = true;
if (new URLSearchParams(location.search).get("join")) netStatus("You've been invited. Enter your name and press Join.");
UI.title();

/* ---------- everyone's cursors ----------
   Each player sends where they point ~14 times a second; the host relays it. In battle the cursor is a
   world position; on the War Table, War Council and lobby it is pinned to the element under it (a map node,
   a research tile, a button) so it lands on the same thing on screens of any size. */
NET.cursors = {};
let curLast = 0, curPending = null;
function cursorPayload(cx, cy) {
  if (B && !$("hud").hidden) return { v: "battle", x: Math.round(mouseW.x), y: Math.round(mouseW.y) };
  const el = document.elementFromPoint(cx, cy), p = { v: NET.view || "lobby", nx: +(cx / innerWidth).toFixed(4), ny: +(cy / innerHeight).toFixed(4) };
  const a = el && el.closest && el.closest("[data-r], .node, [data-cmd], [data-p], [data-rel], [data-leg], [data-ndiff], [data-nstart], button[id], .tree-h");
  if (a) {
    let key = null;
    if (a.dataset.r) key = '[data-r="' + a.dataset.r + '"]';
    else if (a.classList.contains("node")) key = '.node[data-c="' + a.dataset.c + '"][data-i="' + a.dataset.i + '"]';
    else for (const k of ["cmd", "p", "rel", "leg", "ndiff", "nstart"]) if (a.dataset[k] != null) { key = "[data-" + k + '="' + a.dataset[k] + '"]'; break; }
    if (!key && a.id) key = "#" + a.id;
    if (key) { const r = a.getBoundingClientRect(); p.a = key; p.fx = +((cx - r.left) / Math.max(1, r.width)).toFixed(3); p.fy = +((cy - r.top) / Math.max(1, r.height)).toFixed(3); }
  }
  return p;
}
function sendCursor(p) {
  if (!NET.on) return;
  if (NET.host) bcast(Object.assign({ k: "cur", s: 0 }, p)); else send(NET.conn, Object.assign({ k: "cur" }, p));
}
addEventListener("pointermove", e => {
  if (!NET.on) return;
  curPending = [e.clientX, e.clientY];
  const now = performance.now(); if (now - curLast < 70) return; curLast = now;
  sendCursor(cursorPayload(e.clientX, e.clientY)); curPending = null;
}, { passive: true, capture: true });
// re-send the cursor when the view changes under a still mouse (e.g. the host opens the War Council)
setInterval(() => { if (NET.on && curPending) { sendCursor(cursorPayload(curPending[0], curPending[1])); curPending = null; } }, 250);
function gotCursor(slot, m) { if (slot === NET.me) return; NET.cursors[slot] = Object.assign({}, m, { t: performance.now() }); }
const curName = i => { const L = NET.host ? NET.players : NET.lobbyState && NET.lobbyState.players; return (L && L[i] && L[i].name) || (RUN && RUN.coop && RUN.coop[i] && RUN.coop[i].name) || "Commander " + COOP_NUM[i]; };

// battle: drawn in world space by render() (constant size on screen)
NET.drawCursors = g => {
  const now = performance.now();
  for (const k in NET.cursors) {
    const c = NET.cursors[k], i = +k; if (c.v !== "battle" || now - c.t > 4000) continue;
    const sm = c.sm || (c.sm = { x: c.x, y: c.y }); sm.x += (c.x - sm.x) * 0.3; sm.y += (c.y - sm.y) * 0.3;
    const s = 1 / (VIEW.s || 1), col = COOP_COL[i] || "#fff";
    g.save(); g.translate(sm.x, sm.y); g.scale(s, s);
    g.fillStyle = col; g.strokeStyle = "rgba(0,0,0,.85)"; g.lineWidth = 2;
    g.beginPath(); g.moveTo(0, 0); g.lineTo(0, 18); g.lineTo(5, 13); g.lineTo(9, 21); g.lineTo(12, 19.5); g.lineTo(8, 11.5); g.lineTo(14, 11.5); g.closePath(); g.stroke(); g.fill();
    g.font = "700 12px Cinzel, Georgia, serif"; g.textAlign = "left"; g.lineWidth = 3; g.strokeText(curName(i), 14, 30); g.fillText(curName(i), 14, 30);
    g.restore();
  }
};
// menus: a DOM overlay
function cursorFrame() {
  requestAnimationFrame(cursorFrame);
  let box = document.getElementById("net-cursors");
  if (!NET.on) { if (box) box.innerHTML = ""; return; }
  if (!box) { box = document.createElement("div"); box.id = "net-cursors"; document.body.appendChild(box); }
  const now = performance.now(), want = new Set();
  const menu = !B || $("hud").hidden;
  for (const k in NET.cursors) {
    const c = NET.cursors[k], i = +k;
    if (!menu || c.v === "battle" || c.v !== (NET.view || "lobby") || now - c.t > 4000) continue;
    let x = c.nx * innerWidth, y = c.ny * innerHeight;
    if (c.a) { const el = document.querySelector(c.a); if (el) { const r = el.getBoundingClientRect(); if (r.width) { x = r.left + c.fx * r.width; y = r.top + c.fy * r.height; } } }
    const sm = c.dsm || (c.dsm = { x, y }); sm.x += (x - sm.x) * 0.35; sm.y += (y - sm.y) * 0.35;
    let el = box.querySelector('[data-cur="' + i + '"]');
    if (!el) { el = document.createElement("div"); el.className = "netcur"; el.dataset.cur = i; el.style.setProperty("--cc", COOP_COL[i] || "#fff"); el.innerHTML = '<svg width="18" height="24" viewBox="0 0 18 24"><path d="M1 1 L1 19 L6 14 L10 22 L13 20.5 L9 12.5 L15 12.5 Z" fill="currentColor" stroke="#000" stroke-width="1.5"/></svg><span></span>'; box.appendChild(el); }
    el.querySelector("span").textContent = curName(i);
    el.style.transform = "translate(" + sm.x.toFixed(1) + "px," + sm.y.toFixed(1) + "px)";
    want.add(String(i));
  }
  for (const el of [...box.children]) if (!want.has(el.dataset.cur)) el.remove();
}
requestAnimationFrame(cursorFrame);
